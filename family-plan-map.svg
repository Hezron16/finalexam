<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t d">
<title id="t">A family meeting-point map</title><desc id="d">A simple neighbourhood map showing home, a nearby meeting point at a basketball court, and an evacuation centre at a school, connected by dashed routes.</desc>
<rect width="800" height="450" fill="#cfe3f8"/>
<rect width="800" height="450" fill="#e8f1e4"/><rect x="0" y="200" width="800" height="50" fill="#9aa5b5"/><rect x="380" y="0" width="50" height="450" fill="#9aa5b5"/><rect x="110" y="90" width="110" height="70" fill="#ffffff" stroke="#0b2a5b" stroke-width="4"/><polygon points="98,90 165.0,40 232,90" fill="#0b2a5b"/><rect x="151.0" y="118" width="28" height="42" fill="#fbc12c" stroke="#0b2a5b" stroke-width="3"/><rect x="122" y="106" width="26" height="24" fill="#cfe3f8" stroke="#0b2a5b" stroke-width="3"/><text x="165" y="190" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="20" fill="#0b2a5b">Home</text><rect x="500" y="80" width="170" height="90" fill="#e8b4a0" stroke="#0b2a5b" stroke-width="4"/><circle cx="585" cy="125" r="24" fill="none" stroke="#ffffff" stroke-width="4"/><text x="585" y="68" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="20" fill="#0b2a5b">Meeting point (court)</text><rect x="460" y="300" width="250" height="110" fill="#ffffff" stroke="#0b2a5b" stroke-width="5"/><polygon points="455,300 585,250 715,300" fill="#1d5ba6"/><text x="585" y="365" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="22" fill="#0b2a5b">Evacuation centre</text><path d="M170 170 V225 H500 V170" fill="none" stroke="#1b6b3a" stroke-width="7" stroke-dasharray="14 10"/><path d="M585 170 V225 H640 V300" fill="none" stroke="#d9480f" stroke-width="7" stroke-dasharray="14 10"/>
</svg>